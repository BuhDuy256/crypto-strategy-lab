# Nginx config for the SPA "web" service in the full-system Compose topology.
#
# Two jobs:
#   1. Serve the built React app and let the client-side router handle unknown
#      paths (single-page app fallback to index.html).
#   2. Reverse-proxy the "/api" prefix to the api process, stripping "/api" so
#      the backend sees the same paths the dev Vite proxy produces
#      (see apps/web/vite.config.ts). The SPA only ever calls "/api/*"
#      (see apps/web/src/api/client.ts).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes: fall back to the SPA shell for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API.
    #
    # The api process is a separate container that the demo restarts on purpose
    # ("restart the API mid-run"), which gives it a new IP. Nginx resolves an
    # upstream host name only once at startup unless told otherwise, so the api
    # host is put in a variable and re-resolved through Docker's embedded DNS
    # (127.0.0.11) with a short TTL. That keeps the proxy working across an api
    # restart instead of pinning a dead address and returning 502.
    #
    # With a variable in proxy_pass, nginx no longer strips the location prefix
    # itself, so an explicit rewrite drops "/api" (turning "/api/health" into
    # "/health"); the query string is carried over automatically.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
    }
}

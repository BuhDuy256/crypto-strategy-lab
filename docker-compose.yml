# Full-system integration and demo topology for Crypto Strategy Lab.
#
# This assembles the whole process topology the current product version needs,
# from a clean checkout, with one command:
#
#   docker compose up --build
#
# The topology is V4's current MKT-06 state: V1-V3, ephemeral Redis Pub/Sub, and
# the separate market ingest process that holds the Binance kline connection.
#
# Host development is a separate, still-supported path that runs the API and
# SPA as pnpm commands against a PostgreSQL container; see README.md. This file
# is the full-system path, not a replacement for it.
#
# Configuration comes from the repository-root .env (Compose interpolates
# ${VAR} from it). The backend services reach PostgreSQL by its service name
# on the Compose network, so they set POSTGRES_HOST=postgres and the internal
# POSTGRES_PORT=5432 here rather than the host values in .env.

# Shared PostgreSQL connection for every backend process role.
x-backend-postgres-env: &backend-postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-strategy-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # V4 best-effort live notification fan-out only. Persistence and BullMQ are
  # deliberately absent until SETUP-08/WS-02 in V6.
  redis:
    image: redis:7.4-alpine
    container_name: crypto-strategy-lab-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: apply every pending migration, then exit. api and runner wait for
  # it to complete so they never start against an unmigrated database. Safe to
  # run repeatedly; already-applied migrations are a no-op (SETUP-04).
  migrate:
    build:
      context: .
      target: backend
    image: crypto-strategy-lab-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-postgres-env
    command: ["pnpm", "run", "migrate"]
    restart: "no"

  # The NestJS API/HTTP process role.
  api:
    build:
      context: .
      target: backend
    image: crypto-strategy-lab-backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *backend-postgres-env
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      WS_OUTBOUND_BUFFER_MAX: ${WS_OUTBOUND_BUFFER_MAX:-32}
      LEADERBOARD_TOP_K: ${LEADERBOARD_TOP_K:-10}
      # Runtime build identity. The API freezes each search spec with these,
      # so the runner (below) must carry the same values or acceptance fails.
      DEPENDENCY_LOCK_HASH: ${DEPENDENCY_LOCK_HASH}
      APPLICATION_COMMIT: ${APPLICATION_COMMIT}
      WORKER_COMMIT: ${WORKER_COMMIT}
      DETERMINISTIC_CONFIG_VERSION: ${DETERMINISTIC_CONFIG_VERSION:-1.0.0}
    command: ["pnpm", "run", "start:api"]
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # The separate PostgreSQL-backed backtest runner process role. It is its own
  # process on purpose (ADR-010): stopping the API mid-run does not stop it.
  runner:
    build:
      context: .
      target: backend
    image: crypto-strategy-lab-backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-postgres-env
      LEADERBOARD_TOP_K: ${LEADERBOARD_TOP_K:-10}
      BACKTEST_RUNNER_CONCURRENCY: ${BACKTEST_RUNNER_CONCURRENCY:-1}
      # Must match the api service's values (see note above).
      DEPENDENCY_LOCK_HASH: ${DEPENDENCY_LOCK_HASH}
      APPLICATION_COMMIT: ${APPLICATION_COMMIT}
      WORKER_COMMIT: ${WORKER_COMMIT}
      DETERMINISTIC_CONFIG_VERSION: ${DETERMINISTIC_CONFIG_VERSION:-1.0.0}
    command: ["pnpm", "run", "start:backtest-runner"]
    restart: unless-stopped

  # The separate market ingest process role. It holds the long-lived Binance
  # kline WebSocket connection, commits closed candles to PostgreSQL, and
  # publishes best-effort live notifications to Redis. It is its own process on
  # purpose: a provider connection must never compete with interactive API and
  # client WebSocket traffic (ADR-008).
  market-ingest:
    build:
      context: .
      target: backend
    image: crypto-strategy-lab-backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *backend-postgres-env
      REDIS_URL: redis://redis:6379
      MARKET_INGEST_SYMBOL: ${MARKET_INGEST_SYMBOL:-BTCUSDT}
      MARKET_INGEST_TIMEFRAMES: ${MARKET_INGEST_TIMEFRAMES:-1m,5m,15m,30m,1h,2h,4h,1d}
      BINANCE_STREAM_URL: ${BINANCE_STREAM_URL:-wss://data-stream.binance.vision}
    command: ["pnpm", "run", "start:market-ingest"]
    restart: unless-stopped

  # The React SPA, built and served by Nginx, which proxies /api to the api
  # process (apps/web/nginx.conf).
  web:
    build:
      context: .
      target: web
    image: crypto-strategy-lab-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
